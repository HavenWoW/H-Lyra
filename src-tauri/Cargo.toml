[package]
name = "lyra"
version = "1.0.0"
description = "Next-Generation HavenCore (BFA 8.3.7.35662) Database Studio"
authors = ["HavenCore Team"]
edition = "2021"

[lib]
name = "lyra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio-rustls", "chrono", "bigdecimal", "macros"] }
parking_lot = "0.12"
regex = "1.10"
lazy_static = "1.5"
byteorder = "1.5"
open = "5"

[profile.release]
opt-level = 2
lto = "off"
codegen-units = 16
panic = "abort"
strip = "debuginfo"

# Fast development release profile
[profile.fast-release]
inherits = "release"
opt-level = 2
lto = "off"
codegen-units = 16
